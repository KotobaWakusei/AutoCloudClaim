name: Build & Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

# 只有 main 不被新提交打断，保证每次 push 都发一个 release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # 仓库里没有 gradle wrapper，这里固定 Gradle 版本
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/autocloud.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/autocloud.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" "AutoCloudClaim-build-${{ github.run_number }}.apk"
          ls -lh AutoCloudClaim-build-*.apk

      - name: Upload artifact (每个分支的每次 push)
        uses: actions/upload-artifact@v7
        with:
          name: AutoCloudClaim-build-${{ github.run_number }}
          path: AutoCloudClaim-build-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (仅 main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: AutoCloudClaim build ${{ github.run_number }}
          files: AutoCloudClaim-build-${{ github.run_number }}.apk
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            commit `${{ github.sha }}`
            branch `${{ github.ref_name }}`
            触发人 `${{ github.actor }}`
